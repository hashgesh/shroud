<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="320" height="64" rx="6" fill="#0a0514"/>

  <!-- mark: same frame + core + fold as logo.svg, scaled into the left 64px -->
  <g transform="translate(8 8)">
    <rect x="10" y="10" width="28" height="28" rx="6" transform="rotate(45 24 24)"
          stroke="#00f0ff" stroke-width="2" fill="#0d0620"/>
    <rect x="16" y="16" width="16" height="16" rx="3" fill="url(#core)" filter="url(#g)"/>
    <g fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#g)">
      <path d="M4 22 Q24 14 44 22"/>
      <path d="M4 32 Q24 24 44 32"/>
    </g>
  </g>

  <text x="78" y="41" font-family="'Share Tech Mono', Consolas, monospace" font-weight="700"
        font-size="30" letter-spacing="1" fill="#e8e4ff">shr<tspan fill="#ff2bd6">o</tspan>ud</text>
</svg>
