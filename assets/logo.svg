<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <filter id="glowC" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowM" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff67e6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="220" height="220" fill="#0a0514"/>

  <!-- circuit traces breaking out of frame -->
  <g stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M110 4 L110 22"/>
    <path d="M30 24 L46 36"/>
    <path d="M190 24 L174 36"/>
    <path d="M14 110 L32 110"/>
    <path d="M206 110 L188 110"/>
    <path d="M30 196 L46 184"/>
    <path d="M190 196 L174 184"/>
    <path d="M110 216 L110 198"/>
    <circle cx="110" cy="4" r="3.5" fill="#00f0ff"/>
    <circle cx="30" cy="24" r="3.5" fill="#00f0ff"/>
    <circle cx="190" cy="24" r="3.5" fill="#00f0ff"/>
    <circle cx="14" cy="110" r="3.5" fill="#00f0ff"/>
    <circle cx="206" cy="110" r="3.5" fill="#00f0ff"/>
    <circle cx="30" cy="196" r="3.5" fill="#00f0ff"/>
    <circle cx="190" cy="196" r="3.5" fill="#00f0ff"/>
    <circle cx="110" cy="216" r="3.5" fill="#00f0ff"/>
  </g>

  <!-- outer chip frame, rotated square -->
  <rect x="34" y="34" width="152" height="152" rx="16" transform="rotate(45 110 110)"
        stroke="#2a1a4d" stroke-width="2" fill="#0d0620"/>
  <rect x="34" y="34" width="152" height="152" rx="16" transform="rotate(45 110 110)"
        stroke="#00f0ff" stroke-width="1.5" fill="none" opacity="0.55" filter="url(#glowC)"/>

  <!-- glowing byte core -->
  <circle cx="110" cy="110" r="46" fill="url(#coreGlow)"/>
  <rect x="84" y="84" width="52" height="52" rx="8" fill="url(#coreGrad)" filter="url(#glowM)"/>
  <g fill="#0a0514" font-family="monospace" font-size="11" font-weight="700">
    <text x="110" y="107" text-anchor="middle">1011</text>
    <text x="110" y="120" text-anchor="middle">0101</text>
  </g>

  <!-- draped cloth folds over the core -->
  <g fill="none" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" filter="url(#glowC)">
    <path d="M18 76 Q110 50 202 76"/>
    <path d="M18 110 Q110 84 202 110"/>
    <path d="M18 144 Q110 118 202 144"/>
  </g>
  <g fill="none" stroke="#e8e4ff" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <path d="M18 76 Q110 50 202 76"/>
    <path d="M18 110 Q110 84 202 110"/>
    <path d="M18 144 Q110 118 202 144"/>
  </g>
</svg>
