<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- GitHub social preview size (1280x640, 1.91:1). Export to PNG and upload under
       Settings > General > Social preview — GitHub does not accept SVG there. -->
  <defs>
    <filter id="glowC" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowM" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff67e6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="30%" cy="35%" r="60%">
      <stop offset="0" stop-color="#2a1550" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0514" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGlow)"/>
  <g stroke="#1e1240" stroke-width="1">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280"/>
    <path d="M320 0 V640 M640 0 V640 M960 0 V640"/>
  </g>

  <!-- mark, left side -->
  <g transform="translate(150 190)">
    <g stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <path d="M130 4 L130 26"/>
      <path d="M36 28 L54 42"/>
      <path d="M224 28 L206 42"/>
      <path d="M16 130 L38 130"/>
      <path d="M244 130 L222 130"/>
      <path d="M36 232 L54 218"/>
      <path d="M224 232 L206 218"/>
      <path d="M130 256 L130 234"/>
      <circle cx="130" cy="4" r="4" fill="#00f0ff"/>
      <circle cx="36" cy="28" r="4" fill="#00f0ff"/>
      <circle cx="224" cy="28" r="4" fill="#00f0ff"/>
      <circle cx="16" cy="130" r="4" fill="#00f0ff"/>
      <circle cx="244" cy="130" r="4" fill="#00f0ff"/>
      <circle cx="36" cy="232" r="4" fill="#00f0ff"/>
      <circle cx="224" cy="232" r="4" fill="#00f0ff"/>
      <circle cx="130" cy="256" r="4" fill="#00f0ff"/>
    </g>
    <rect x="40" y="40" width="180" height="180" rx="18" transform="rotate(45 130 130)"
          stroke="#2a1a4d" stroke-width="2.5" fill="#0d0620"/>
    <rect x="40" y="40" width="180" height="180" rx="18" transform="rotate(45 130 130)"
          stroke="#00f0ff" stroke-width="1.5" fill="none" opacity="0.55" filter="url(#glowC)"/>
    <circle cx="130" cy="130" r="54" fill="url(#coreGlow)"/>
    <rect x="99" y="99" width="62" height="62" rx="9" fill="url(#coreGrad)" filter="url(#glowM)"/>
    <g fill="#0a0514" font-family="monospace" font-size="13" font-weight="700">
      <text x="130" y="124" text-anchor="middle">1011</text>
      <text x="130" y="140" text-anchor="middle">0101</text>
    </g>
    <g fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" filter="url(#glowC)">
      <path d="M22 90 Q130 60 238 90"/>
      <path d="M22 130 Q130 100 238 130"/>
      <path d="M22 170 Q130 140 238 170"/>
    </g>
    <g fill="none" stroke="#e8e4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
      <path d="M22 90 Q130 60 238 90"/>
      <path d="M22 130 Q130 100 238 130"/>
      <path d="M22 170 Q130 140 238 170"/>
    </g>
  </g>

  <!-- wordmark + tagline, right side -->
  <g transform="translate(470 0)">
    <text x="0" y="300" font-family="'Share Tech Mono', Consolas, monospace" font-weight="700"
          font-size="96" letter-spacing="2" fill="#e8e4ff">shr<tspan fill="#ff2bd6">o</tspan>ud</text>
    <text x="4" y="350" font-family="'Share Tech Mono', Consolas, monospace" font-size="22"
          letter-spacing="1" fill="#7a6fa3">source-level C++ obfuscator</text>
    <text x="4" y="385" font-family="'Share Tech Mono', Consolas, monospace" font-size="16"
          letter-spacing="0.5" fill="#4a4270">rename &#183; encrypt strings &#183; duplicate control flow &#183; prove it in the binary</text>
  </g>
</svg>
