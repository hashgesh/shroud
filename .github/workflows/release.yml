name: release

# Build a relocatable shroud package on each native platform and attach it to
# the GitHub release for the pushed tag. The package bundles libclang and the
# clang resource-dir, and the binary finds them relative to itself (see
# CMakeLists.txt install() and src/obfuscate.cpp), so it runs with no system
# LLVM installed.

on:
  push:
    tags:
      - 'v*'
  # Manual dry run of the build/smoke matrix without cutting a release.
  workflow_dispatch:

permissions:
  contents: write  # create the release and upload assets

env:
  # Pinned libclang major for Linux and macOS (each package bundles its own
  # libclang, so platforms need not match). Windows pins LLVM 20 in its own
  # step to satisfy the runner's MSVC STL.
  LLVM_VERSION: '18'

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to 22.04 (glibc 2.35), not ubuntu-latest, so the dynamically
          # linked binary runs on older distros instead of requiring the newest
          # runner's glibc.
          - os: ubuntu-22.04
            platform: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            platform: macos-arm64
            archive: tar.gz
          - os: windows-latest
            platform: windows-x86_64
            archive: zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }} (Linux)
        if: runner.os == 'Linux'
        run: |
          # jammy's default repos don't carry LLVM 18, so add apt.llvm.org.
          # Its jammy build links glibc 2.35, matching the pinned runner, so the
          # bundled libclang stays as portable as the shroud binary itself.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y "libclang-${LLVM_VERSION}-dev" "llvm-${LLVM_VERSION}-dev"
          echo "LLVM_ROOT=/usr/lib/llvm-${LLVM_VERSION}" >> "$GITHUB_ENV"

      - name: Install LLVM ${{ env.LLVM_VERSION }} (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install "llvm@${LLVM_VERSION}"
          prefix=$(brew --prefix "llvm@${LLVM_VERSION}")
          echo "LLVM_ROOT=${prefix}" >> "$GITHUB_ENV"
          echo "CXX=${prefix}/bin/clang++" >> "$GITHUB_ENV"
          # Pair this LLVM's libclang/clang with its *own* libc++ headers: the
          # Xcode SDK's libc++ tracks the newest clang and an older libclang
          # can't parse it. -isysroot still supplies the C runtime headers.
          # The smoke test forwards these to both obfuscate and CXX.
          sdk=$(xcrun --show-sdk-path)
          echo "SHROUD_OBF_FLAGS=-isysroot ${sdk} -nostdinc++ -isystem ${prefix}/include/c++/v1 -stdlib=libc++" >> "$GITHUB_ENV"

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pin LLVM 20 here, not 18: the runner's MSVC STL requires Clang 20+
          # (static_assert STL1000), so an older libclang cannot parse <type_traits>.
          # Windows LLVM uses the MSVC STL, so there is no own-libc++ escape hatch
          # as on macOS. --allow-downgrade pins regardless of the preinstalled patch.
          choco install llvm --version=20.1.8 -y --no-progress --allow-downgrade
          "LLVM_ROOT=C:/Program Files/LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:/Program Files/LLVM/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Test
        # ctest selects a multi-config build with -C, not --config (that is a
        # cmake --build flag); -C is harmless on single-config Linux/macOS.
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install into a relocatable package tree
        run: |
          name="shroud-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          echo "PKG_NAME=${name}" >> "$GITHUB_ENV"
          cmake --install build --config Release --prefix "dist/${name}"

      - name: Verify libclang and the resource-dir are bundled
        run: |
          pkg="dist/${PKG_NAME}"
          echo "== package tree =="
          find "$pkg" -maxdepth 2 | sort
          ls "$pkg"/lib/clang/*/include/stddef.h
          if [ "${{ runner.os }}" = "Windows" ]; then
            ls "$pkg"/bin/libclang.dll
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ls "$pkg"/lib/libclang*.dylib
          else
            ls "$pkg"/lib/libclang*.so*
          fi

      - name: Smoke test the package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tests/pkg-smoke.sh "dist/${PKG_NAME}"

      - name: Smoke test the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Relocate the package so nothing depends on the build location, strip
          # LLVM from PATH, and obfuscate -> build -> run with only the package's
          # own libclang.dll (beside the .exe) and relative resource-dir.
          $reloc = Join-Path $env:RUNNER_TEMP 'shroud-pkg'
          Copy-Item -Recurse -Force "dist/$env:PKG_NAME" $reloc
          $bin = Join-Path $reloc 'bin/shroud.exe'
          $clangBin = 'C:\Program Files\LLVM\bin'
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne $clangBin }) -join ';'
          $work = Join-Path $env:RUNNER_TEMP 'work'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item tests/sample/main.cpp (Join-Path $work 'sample.cpp')
          Push-Location $work
          & $bin obfuscate sample.cpp --out sample.obf.cpp --map sample.map
          if ($LASTEXITCODE -ne 0) { throw 'obfuscate failed' }
          if (-not (Select-String -Path sample.obf.cpp -Pattern '#include <shroud/runtime.hpp>' -Quiet)) {
            throw 'output missing runtime include'
          }
          & "$clangBin\clang++.exe" -std=c++20 -O1 -I"$reloc/include" sample.obf.cpp -o sample.exe
          if ($LASTEXITCODE -ne 0) { throw 'obfuscated build failed' }
          & .\sample.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'obfuscated sample crashed' }
          Pop-Location
          Write-Host 'PASS: packaged shroud.exe is self-contained'

      - name: Archive and checksum
        run: |
          name="$PKG_NAME"
          mkdir -p out
          if [ "${{ matrix.archive }}" = "zip" ]; then
            asset="${name}.zip"
            # 7-Zip (preinstalled on the runner) deflate-compresses the package;
            # the bundled bsdtar writes a zip but stores it uncompressed.
            ( cd dist && 7z a -tzip -mx=7 "../out/${asset}" "$name" >/dev/null )
          else
            asset="${name}.tar.gz"
            tar -C dist -czf "out/${asset}" "$name"
          fi
          echo "ASSET=out/${asset}" >> "$GITHUB_ENV"
          ( cd out && \
            if command -v sha256sum >/dev/null; then sha256sum "${asset}" > "${asset}.sha256"; \
            else shasum -a 256 "${asset}" > "${asset}.sha256"; fi )
          echo "== artifacts =="
          ls -l out
          cat out/*.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: out/*

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  # Fill the release body with the changelog for this tag, after the per-platform
  # jobs have created the release and attached the assets. git-cliff runs only in
  # this Linux job (it is a Docker action), so the matrix stays untouched.
  release-notes:
    name: release notes
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs the full history and all tags
      - name: Generate release notes with git-cliff
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Set the release body
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cliff.outputs.content }}
